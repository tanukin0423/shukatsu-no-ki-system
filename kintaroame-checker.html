<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金太郎飴チェッカー｜就活の木</title>
<style>
  :root{
    --bg:#2d6b4a;
    --deep:#3d8a5f;
    --mid:#4da070;
    --gold:#d4a843;
    --mint:#6de0b0;
    --card:#3a7a55;
    --card-border:#5aaa7a;
    --gray-text:#d0ede0;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(160deg, var(--bg) 0%, #1f4d36 100%);
    color:var(--white);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  header{text-align:center;margin-bottom:28px;}
  header .badge{
    display:inline-block;
    background:var(--gold);
    color:#2d3a1f;
    font-weight:700;
    font-size:12px;
    padding:4px 14px;
    border-radius:20px;
    letter-spacing:.05em;
    margin-bottom:14px;
  }
  header h1{
    font-size:26px;
    margin:0 0 10px;
    line-height:1.4;
  }
  header h1 .emoji{font-size:30px;margin-right:6px;}
  header p{
    color:var(--gray-text);
    font-size:14px;
    line-height:1.8;
    margin:0 auto;
    max-width:560px;
  }
  header p b{color:var(--mint);}

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:22px 20px;
    margin-bottom:20px;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
  }
  .card h2{
    font-size:15px;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--white);
  }
  .card h2 .num{
    background:var(--gold);
    color:#2d3a1f;
    width:22px;height:22px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;flex-shrink:0;
  }

  label{
    display:block;
    font-size:12.5px;
    color:var(--gray-text);
    margin-bottom:6px;
    font-weight:600;
  }
  .row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .row .col{flex:1;min-width:120px;}
  input[type=text], select, textarea{
    width:100%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-radius:8px;
    padding:9px 12px;
    color:var(--white);
    font-size:14px;
    font-family:inherit;
    outline:none;
  }
  input[type=text]::placeholder, textarea::placeholder{color:rgba(255,255,255,.4);}
  input[type=text]:focus, select:focus, textarea:focus{border-color:var(--mint);}
  textarea{min-height:150px;resize:vertical;line-height:1.7;}
  select{appearance:none;cursor:pointer;}
  select option{color:#000;}

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt-group{
    font-size:10.5px;font-weight:900;letter-spacing:.03em;
    margin:6px 0 1px;display:flex;align-items:center;gap:6px;
  }
  .opt-group.g1{color:var(--mint);}
  .opt-group.g2{color:var(--gold);}
  .opt-group .pill{font-size:9px;font-weight:900;color:#fff;padding:2px 8px;border-radius:20px;}
  .opt-group.g1 .pill{background:var(--mid);}
  .opt-group.g2 .pill{background:var(--gold);color:#2d3a1f;}

  .opt-item{
    display:flex;align-items:flex-start;gap:10px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
  }
  .opt-item input{margin-top:2px;flex-shrink:0;width:16px;height:16px;accent-color:var(--gold);}
  .opt-item .txt{font-size:13px;line-height:1.5;}
  .opt-item .txt b{display:block;font-size:13.5px;margin-bottom:2px;}
  .opt-item .txt span{color:var(--gray-text);font-size:11.5px;}
  .opt-item.disabled{opacity:.55;cursor:not-allowed;}

  .stance{display:flex;gap:8px;flex-wrap:wrap;}
  .stance label.chip{
    flex:1;min-width:90px;text-align:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.2);
    border-radius:10px;padding:9px 6px;
    font-size:12.5px;font-weight:600;color:var(--gray-text);
    cursor:pointer;margin:0;
  }
  .stance input{display:none;}
  .stance input:checked + span{color:#2d3a1f;}
  .stance label.chip:has(input:checked){
    background:var(--gold);border-color:var(--gold);
  }
  .stance label.chip:has(input:checked) span{color:#2d3a1f;font-weight:800;}

  .flow{
    display:flex;align-items:center;gap:4px;flex-wrap:wrap;
    font-size:11px;color:var(--gray-text);margin-top:12px;
    justify-content:center;
  }
  .flow .step{
    background:rgba(255,255,255,.08);
    border-radius:14px;padding:4px 10px;white-space:nowrap;
  }
  .flow .arrow{color:var(--mint);}

  .gen-btn{
    width:100%;
    background:var(--gold);
    color:#2d3a1f;
    border:none;
    border-radius:12px;
    padding:15px;
    font-size:15.5px;
    font-weight:800;
    cursor:pointer;
    letter-spacing:.02em;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    transition:transform .1s;
  }
  .gen-btn:hover{transform:translateY(-1px);}
  .gen-btn:active{transform:translateY(0);}

  .output-wrap{display:none;}
  .output-wrap.show{display:block;}
  textarea#output{
    background:rgba(0,0,0,.25);
    font-size:12.5px;
    min-height:340px;
    white-space:pre-wrap;
    font-family:"SF Mono",Consolas,monospace;
    line-height:1.6;
  }
  .copy-btn{
    margin-top:10px;
    width:100%;
    background:var(--mid);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .copy-btn.copied{background:var(--mint);color:#1f4d36;}

  .note{
    font-size:11.5px;
    color:var(--gray-text);
    text-align:center;
    margin-top:24px;
    line-height:1.8;
  }
  .note .tree{font-size:16px;}

  @media(prefers-reduced-motion:reduce){.gen-btn{transition:none;}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="badge">就活の木 × キャリ爺</div>
    <h1><span class="emoji">🍬</span>金太郎飴チェッカー</h1>
    <p>指摘して終わりにしない。<br><b>問いかけ → あなたの答え → 修正版</b>の順で、自分の言葉で磨くツールです。<br>答え方の"例"も出すので、言葉にするのが苦手でも大丈夫。</p>
  </header>

  <div class="card">
    <h2><span class="num">1</span>診断したいESを入力</h2>
    <div class="row">
      <div class="col field">
        <label>設問タイプ</label>
        <select id="qtype" onchange="toggleCustomQ()">
          <option value="ガクチカ（学業）">ガクチカ（学業で力を入れたこと）</option>
          <option value="ガクチカ（学業以外）">ガクチカ（学業以外／アルバイト・部活等）</option>
          <option value="自己PR" selected>自己PR（強み）</option>
          <option value="志望動機">志望動機（志望理由）</option>
          <option value="長所・短所">長所・短所</option>
          <option value="将来の夢・キャリアビジョン">将来の夢・キャリアビジョン</option>
          <option value="研究内容・卒論">研究内容・卒論</option>
          <option value="その他">その他（自由入力）</option>
        </select>
      </div>
      <div class="col field" style="max-width:110px;">
        <label>文字数</label>
        <input type="text" id="length" placeholder="例：400字">
      </div>
    </div>
    <div class="field" id="custom-q-field" style="display:none;">
      <label>設問（実際の文言）</label>
      <input type="text" id="q-custom" placeholder="例：あなたが仲間と挑戦した経験について教えてください">
    </div>
    <div class="field">
      <label>応募企業（任意）</label>
      <input type="text" id="company" placeholder="例：株式会社〇〇（未入力でも診断できます）">
    </div>
    <div class="field">
      <label>本文</label>
      <textarea id="es" placeholder="ここにESの本文を貼り付けてください"></textarea>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">2</span>診断オプション</h2>
    <div class="opts">
      <div class="opt-group g1"><span class="pill">まず出る</span>指摘・問いかけ</div>
      <label class="opt-item">
        <input type="checkbox" id="opt-score" checked>
        <div class="txt"><b>🍬 金太郎飴度スコア＆論理性評価</b><span>独自性を100点満点で採点し、論理構成もチェック</span></div>
      </label>
      <label class="opt-item">
        <input type="checkbox" id="opt-generic" checked>
        <div class="txt"><b>🔍 弱い箇所の指摘</b><span>本文から実際に引用し、なぜ弱いかを説明</span></div>
      </label>
      <label class="opt-item">
        <input type="checkbox" id="opt-why" checked disabled>
        <div class="txt"><b>❓ 考えさせる問いかけ（回答サンプル例つき）</b><span>選択肢＋自由記述で、言葉にするのが苦手でも答えられる</span></div>
      </label>

      <div class="opt-group g2"><span class="pill">答えたら出る</span>改善・修正版</div>
      <label class="opt-item">
        <input type="checkbox" id="opt-advice" checked>
        <div class="txt"><b>💡 回答を踏まえた改善アドバイス</b><span>足すべき数字・場面・感情を具体的に提案</span></div>
      </label>
      <label class="opt-item">
        <input type="checkbox" id="opt-rewrite" checked>
        <div class="txt"><b>✏️ 修正版ES（ビフォー→アフター）</b><span>あなたの回答を踏まえた到達イメージを提示</span></div>
      </label>
    </div>
    <div class="flow">
      <span class="step">①ES貼付け</span><span class="arrow">→</span>
      <span class="step">②プロンプト生成</span><span class="arrow">→</span>
      <span class="step">③指摘＋問い</span><span class="arrow">→</span>
      <span class="step">④あなたが答える</span><span class="arrow">→</span>
      <span class="step">⑤修正版</span>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">3</span>診断の厳しさ</h2>
    <div class="stance">
      <label class="chip"><input type="radio" name="stance" value="優しめ"><span>優しめ</span></label>
      <label class="chip"><input type="radio" name="stance" value="標準" checked><span>標準</span></label>
      <label class="chip"><input type="radio" name="stance" value="厳しめ"><span>厳しめ</span></label>
    </div>
  </div>

  <button class="gen-btn" onclick="generatePrompt()">🌳 診断プロンプトを生成する</button>

  <div class="card output-wrap" id="output-wrap">
    <h2><span class="num">4</span>生成されたプロンプト</h2>
    <textarea id="output" readonly></textarea>
    <button class="copy-btn" id="copy-btn" onclick="copyOutput()">📋 コピーして claude.ai に貼り付ける</button>
  </div>

  <p class="note"><span class="tree">🌳</span> このプロンプトをclaude.aiに貼ると、対話形式で診断が進みます。<br>いきなり修正版は出ません。まず問いに答えることから始まります。<br>答えは、君の中にある。</p>

</div>

<script>
// 設問タイプ別の評価観点（es-tensakuスキルの観点を反映）
const TYPE_CRITERIA = {
  'ガクチカ（学業）': '冒頭が主体的な問い・目標から始まっているか／具体的な数値（時間・回数・順位・人数）があるか／行動の根拠（なぜその行動をとったか）が書かれているか／因果関係に飛躍がないか',
  'ガクチカ（学業以外）': '冒頭が主体的な問い・目標から始まっているか／具体的な数値（時間・回数・順位・人数）があるか／行動の根拠（なぜその行動をとったか）が書かれているか／因果関係に飛躍がないか',
  '自己PR': '強みが1つに絞れているか（複数混在はNG）／具体アクション（「意識した」で終わっていないか）／実績の根拠（誰が・どう評価したか）／入社後への接続があるか',
  '志望動機': 'その企業でなければならない理由があるか（他社でも通用する汎用文になっていないか）／エピソードがガクチカ・自己PRの使い回しになっていないか／「なぜこの業界か→なぜこの企業か→何をしたいか」の三段構成があるか',
  '長所・短所': '具体的なエピソードで裏付けられているか／短所は「改善中」の姿勢が書かれているか／自己PRと矛盾していないか',
  '将来の夢・キャリアビジョン': '志望企業のビジネスと具体的に接続しているか／なぜ自分がその夢を持つに至ったか（原体験）があるか／抽象的な社会貢献論で終わっていないか',
  '研究内容・卒論': '専門外の面接官にも伝わる言葉で書かれているか／自分が主体的に取り組んだ部分が書かれているか／研究内容が仕事にどう活かせるかへの接続があるか',
  'その他': '主体性（自分が考え・行動した内容）／具体性（数字・固有名詞での裏付け）／論理の流れの自然さ',
};

function toggleCustomQ(){
  const type = document.getElementById('qtype').value;
  document.getElementById('custom-q-field').style.display = (type === 'その他') ? 'block' : 'none';
}

function buildPrompt(){
  const qtype = document.getElementById('qtype').value;
  const qCustom = document.getElementById('q-custom').value.trim();
  const q = (qtype === 'その他' && qCustom) ? qCustom : qtype;
  const length = document.getElementById('length').value.trim();
  const company = document.getElementById('company').value.trim();
  const es = document.getElementById('es').value.trim();
  const stance = document.querySelector('input[name=stance]:checked').value;

  const wantScore = document.getElementById('opt-score').checked;
  const wantGeneric = document.getElementById('opt-generic').checked;
  const wantAdvice = document.getElementById('opt-advice').checked;
  const wantRewrite = document.getElementById('opt-rewrite').checked;
  const wantS2 = wantAdvice || wantRewrite; // 第2ステップを使うか

  let p = '';
  p += '# エントリーシートの独自性・論理 診断（対話で進めてください）\n\n';
  p += 'あなたは、何千枚ものESを読んできた採用担当者であり、就活のプロコーチです。\n';
  p += '以下のESが「誰でも書ける・AIが作ったような"金太郎飴"の文章」になっていないかを、論理的に的確に診断してください。\n\n';

  if (wantS2) {
    p += '## 【進行ルール｜最重要・厳守】\n';
    p += '- これは対話型の添削です。1回の返信で全部を書かないでください。\n';
    p += '- 【第1ステップ】まず「指摘」と「問いかけ」だけを出力し、必ず一旦停止してください。\n';
    p += '- 各問いかけには必ず "回答サンプル例（選択肢2〜3個）" を添えてください。\n';
    p += '  ・サンプルは「答え方の型」を示す短い例に留め、完成文章にはしないこと。\n';
    p += '  ・そのESの内容に即して具体化し、汎用の穴埋めにしないこと。設問の性質（自己PR＝強みの根拠／志望動機＝動機・企業理解／ガクチカ＝行動と工夫）に合わせ、決まった型の使い回しをしないこと。\n';
    p += '  ・「この中に近いものはある？ 別のことをした？ 自由に書いてもOK」と、選択と自由記述の両方を促すこと。\n';
    p += '- 学生から一言でも回答をもらうまで、修正版ES（ビフォー→アフター）や完成文の書き直しは絶対に書かないでください。先回りして代筆しないこと。\n';
    p += '- 学生の回答が「番号だけ／一言」で具体が薄い場合は、すぐ修正版に進まず、その回答に対して"もう一段だけ"具体を尋ねてください。ただし深掘りは1往復までとし、それ以上は催促しないこと。\n';
    p += '- 1往復したら、得られた範囲の情報を最大限に活かして修正版を作ってください（情報が薄くても、そこまでの回答を活かして生成すること）。\n';
    p += '- サンプル例はあくまで"答え方の型"の提示であり、学生の実体験に基づく回答を最優先してください。\n';
    p += '- 学生が答えない・急かしても、修正版は出さず、理由を添えてやさしく回答を促してください。\n\n';
  }

  p += '## 【診断対象のES】\n';
  if (q) p += '- 設問：' + q + '\n';
  if (length) p += '- 文字数の目安：' + length + '\n';
  p += '- 応募企業：' + (company ? company : '（特定の企業は指定なし。汎用的な観点で診断してください）') + '\n';
  p += '\n**【本文】**\n' + (es || '（本文が入力されていません）') + '\n\n';

  const criteria = TYPE_CRITERIA[qtype];
  if (criteria) {
    p += '## 【この設問タイプで特に確認すべき観点】\n';
    p += criteria + '\n';
    p += '（※問いかけ・回答サンプル例も、この設問タイプの性質に即して具体化すること。他の設問タイプの型を流用しないこと）\n\n';
  }

  p += '## 【診断のスタンス】\n【' + stance + '】';
  if (stance === '優しめ') p += '良い点を中心に、課題は控えめに、励ますトーンで伝えてください。\n\n';
  else if (stance === '厳しめ') p += '忖度せず、企業目線でシビアに、しかし人格否定にならない範囲で率直に伝えてください。\n\n';
  else p += '良い点と課題をバランスよく、忖度なく、しかし建設的に伝えてください。\n\n';

  p += '## 【出力内容】\n';
  let n = 1;
  if (wantScore) {
    p += n + '. **🍬 金太郎飴度スコア＆論理性の評価**：独自性を100点満点で採点（＝ビフォー点数）し、その理由を述べてください。あわせて「他の就活生の何割が似たことを書きそうか」を推定し、論理構成（主張→理由→具体→結果→学びの流れに飛躍・矛盾がないか、抽象と具体のバランス）を的確に評価してください。\n';
    n++;
  }
  if (wantGeneric) {
    p += n + '. **🔍 弱い箇所の指摘**：本文から"誰でも書ける・論理が甘い"箇所を実際に引用し、それぞれがなぜ弱いのか（没個性なのか／論理が飛躍しているのか）を根拠とともに説明してください。\n';
    n++;
  }
  p += n + '. **❓ 考えさせる問いかけ（回答サンプル例つき）**：本人の"なぜ"と具体を引き出す問いを投げてください。各問いは必ず次の形式で出してください。\n';
  p += '   ❓ 問いかけ本文\n   💬 ①（答え方の型の例） ②（型の例） ③（型の例）\n   ✏️ この中に近いものはある？ 別のことをした？ 自由に書いてもOKです。\n';
  if (wantS2) {
    p += '   → すべての問いを出し終えたら「この問いに一言でも答えてください。答えをもらえたら、それを踏まえた修正版を作ります」と伝えて、ここで停止してください。\n\n';
    n++;
    p += '## 【第2ステップ｜学生の回答を受け取ってから実行】\n（※回答が薄ければ具体を1往復だけ深掘りしてから、以下を出す）\n';
    if (wantAdvice) {
      p += n + '. **💡 回答を踏まえた改善アドバイス**：学生の回答をもとに、抽象論ではなく「こう直す」という具体的な打ち手を示してください（足すべき数字・固有名詞・場面・感情、補強すべき論理のつながり）。\n';
      n++;
    }
    if (wantRewrite) {
      p += n + '. **✏️ 回答を踏まえた修正版ES（ビフォー→アフター）**：学生の回答（その言葉と事実）を最大限に活かし、「あなたの回答を踏まえるとこう書ける」という形で、設問・文字数に合わせた修正版を作成してください。修正版の前に〈想定スコア（アフター点数）〉と〈ビフォーから良くなった点〉を簡潔に添え、修正版の最後に必ず「これは到達イメージの一例です。ここで使った具体はあなた自身の事実に置き換え、最終的にはあなたの言葉で仕上げてください」と明記してください。\n';
    }
  } else {
    p += '\n';
  }

  p += '\n## 【お願い】\n';
  p += '- 就活生に寄り添う、あたたかい口調で。とくに言葉にするのが苦手な学生を置いていかないこと。\n';
  p += '- 指摘は「ダメ出し」で終わらせず、必ず次の一歩がわかるようにしてください。\n\n';
  p += '答えは、君の中にある。🌳';

  return p;
}

function generatePrompt(){
  const es = document.getElementById('es').value.trim();
  if (!es) {
    alert('ESの本文を入力してください。');
    return;
  }
  const output = buildPrompt();
  document.getElementById('output').value = output;
  document.getElementById('output-wrap').classList.add('show');
  document.getElementById('output-wrap').scrollIntoView({behavior:'smooth', block:'start'});
  const btn = document.getElementById('copy-btn');
  btn.classList.remove('copied');
  btn.textContent = '📋 コピーして claude.ai に貼り付ける';
}

function copyOutput(){
  const output = document.getElementById('output');
  output.select();
  document.execCommand('copy');
  const btn = document.getElementById('copy-btn');
  btn.textContent = '✅ コピーしました！';
  btn.classList.add('copied');
  setTimeout(()=>{
    btn.textContent = '📋 コピーして claude.ai に貼り付ける';
    btn.classList.remove('copied');
  }, 2000);
}
</script>
