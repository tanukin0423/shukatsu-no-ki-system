<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>想定問答プロンプト作成ツール|就活の木</title>
<style>
  :root {
    --paper: #f1ede1;
    --panel: #fbf9f2;
    --ink: #1f2a1e;
    --ink-soft: #6b7568;
    --line: #d9d3bf;
    --forest: #2c4a2e;
    --forest-deep: #16281a;
    --gold: #a8853f;
    --gold-soft: #ece2c8;
    --mono-bg: #16281a;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(44,74,46,0.05), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(168,133,63,0.06), transparent 45%);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
    padding: 0 0 100px;
  }

  header {
    padding: 64px 24px 40px;
    text-align: center;
    position: relative;
  }
  header::after {
    content: '';
    display: block;
    width: 34px;
    height: 1px;
    background: var(--gold);
    margin: 22px auto 0;
  }
  header .kicker {
    font-size: 11.5px;
    letter-spacing: 0.22em;
    color: var(--gold);
  }
  header h1 {
    margin: 16px 0 12px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--forest-deep);
    letter-spacing: 0.03em;
  }
  header p {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0;
    max-width: 380px;
    margin-inline: auto;
  }

  main {
    max-width: 640px;
    margin: 40px auto 0;
    padding: 0 24px;
    position: relative;
  }

  /* 縦につながる幹の線 */
  main::before {
    content: '';
    position: absolute;
    top: 8px;
    bottom: 60px;
    left: 39px;
    width: 1px;
    background: linear-gradient(180deg, var(--line) 0%, var(--line) 92%, transparent 100%);
  }

  .step {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 28px 30px 30px 30px;
    margin: 0 0 22px 56px;
    box-shadow: 0 1px 2px rgba(22,40,26,0.04);
  }
  .step-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .step-num {
    position: absolute;
    left: -56px;
    top: 26px;
    width: 30px;
    height: 30px;
    background: var(--forest);
    color: var(--gold-soft);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    clip-path: polygon(50% 0%, 100% 30%, 82% 100%, 18% 100%, 0% 30%);
    flex-shrink: 0;
  }
  .step-head h2 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "游明朝", serif;
    font-size: 17px;
    margin: 0;
    font-weight: 600;
    color: var(--forest-deep);
  }

  label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 16px 0 7px;
  }
  label:first-of-type { margin-top: 0; }

  input[type="text"], textarea {
    width: 100%;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 11px 13px;
    resize: vertical;
    transition: border-color 0.15s;
  }
  textarea { min-height: 92px; }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--forest);
  }

  .radio-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .radio-row label.pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    padding: 8px 16px;
    border: 1px solid var(--line);
    border-radius: 2px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: #ffffff;
    transition: all 0.15s;
  }
  .radio-row input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .radio-row label.pill { position: relative; }
  .radio-row label.pill:has(input:checked) {
    border-color: var(--forest);
    background: var(--forest);
    color: #f1ede1;
  }

  .spark {
    color: #c9773f;
    font-size: 12px;
    margin-right: 1px;
  }

  /* 面接段階カード */
  .stage-row {
    display: flex;
    gap: 10px;
  }
  .stage-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 8px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #ffffff;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .stage-card input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; }
  .stage-icon { font-size: 20px; line-height: 1; filter: grayscale(65%); opacity: 0.55; transition: all 0.15s; }
  .stage-label { font-size: 12px; color: var(--ink-soft); transition: all 0.15s; }
  .stage-card:hover { border-color: var(--ink-soft); }
  .stage-card.stage-1:has(input:checked) { border-color: #5f8f5c; background: #eef5ec; }
  .stage-card.stage-2:has(input:checked) { border-color: #b3922f; background: #faf3e2; }
  .stage-card.stage-3:has(input:checked) { border-color: #2c4a2e; background: #e7ede4; }
  .stage-card:has(input:checked) .stage-icon { filter: grayscale(0%); opacity: 1; transform: scale(1.08); }
  .stage-card:has(input:checked) .stage-label { color: var(--ink); font-weight: 700; }

  /* ESブロックの色分け */
  .es-block {
    border-left: 3px solid var(--line);
    padding: 4px 0 4px 16px;
    margin-bottom: 22px;
  }
  .es-block:last-child { margin-bottom: 0; }
  .es-block-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .es-block textarea { background: #ffffff; }

  .es-blue { border-left-color: #6f8fb5; }
  .es-blue .es-block-title { color: #4c6a8c; }
  .es-blue textarea:focus, .es-blue input:focus { border-color: #6f8fb5; }

  .es-green { border-left-color: #7fac83; }
  .es-green .es-block-title { color: #587e5c; }
  .es-green textarea:focus { border-color: #7fac83; }

  .es-purple { border-left-color: #a68fc0; }
  .es-purple .es-block-title { color: #7c619a; }
  .es-purple textarea:focus { border-color: #a68fc0; }

  .es-beige { border-left-color: #c2a878; }
  .es-beige .es-block-title { color: #93764a; }
  .es-beige textarea:focus { border-color: #c2a878; }

  .hint {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 10px;
    line-height: 1.6;
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 8px 0 34px 56px;
  }
  button {
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.02em;
    border-radius: 2px;
    padding: 13px 28px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  #generateBtn {
    background: var(--forest);
    color: #f6f2e6;
  }
  #generateBtn:hover { background: var(--forest-deep); }
  #resetBtn {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--line);
  }
  #resetBtn:hover { border-color: var(--ink-soft); color: var(--ink); }

  #output-section { display: none; }
  #output-section.show { display: block; }

  #outputBox {
    width: 100%;
    min-height: 260px;
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.65;
    background: var(--mono-bg);
    color: #dfe6d8;
    border: none;
    border-radius: 2px;
    padding: 20px;
    white-space: pre-wrap;
  }
  #copyBtn {
    margin-top: 14px;
    background: var(--gold);
    color: #2a2210;
    width: 100%;
    font-weight: 700;
  }
  #copyBtn:hover { background: #937329; }
  #copyBtn.copied { background: var(--forest); color: #f1ede1; }

  @media (max-width: 520px) {
    main { padding: 0 16px; }
    main::before { left: 27px; }
    .step { margin-left: 44px; padding: 22px 20px 24px; }
    .step-num { left: -44px; width: 26px; height: 26px; font-size: 11px; }
    .actions { margin-left: 44px; }
    header h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<header>
  <div class="kicker">就活の木　内部運用ツール</div>
  <h1>想定問答プロンプト作成</h1>
  <p>企業名・職種・エントリーシートを入力するだけで、想定問答作成用の投稿文を組み立てます</p>
</header>

<main>

  <div class="step">
    <div class="step-head">
      <div class="step-num">0</div>
      <h2>使用先を選択</h2>
    </div>
    <div class="radio-row">
      <label class="pill mode-pill"><input type="radio" name="mode" value="project" checked><span class="spark">✦</span>プロジェクト用(短縮版)</label>
      <label class="pill"><input type="radio" name="mode" value="general">汎用AI用(指示文フル同梱)</label>
    </div>
    <p class="hint" id="modeHint">「想定問答作成(汎用版)」プロジェクトの指示欄に、あらかじめカスタム指示文を登録済みの場合はこちら。入力内容だけの短い投稿文を作ります。</p>
  </div>

  <div class="step">
    <div class="step-head">
      <div class="step-num">1</div>
      <h2>基本情報</h2>
    </div>
    <label for="company">志望企業名</label>
    <input type="text" id="company" placeholder="例:株式会社〇〇">

    <label for="jobtype">希望職種</label>
    <input type="text" id="jobtype" placeholder="例:法人営業職">

    <label>面接段階</label>
    <div class="stage-row">
      <label class="stage-card stage-1"><input type="radio" name="stage" value="一次面接" checked><span class="stage-icon">🌱</span><span class="stage-label">一次面接</span></label>
      <label class="stage-card stage-2"><input type="radio" name="stage" value="二次面接"><span class="stage-icon">🌿</span><span class="stage-label">二次面接</span></label>
      <label class="stage-card stage-3"><input type="radio" name="stage" value="最終面接"><span class="stage-icon">🌳</span><span class="stage-label">最終面接</span></label>
    </div>
  </div>

  <div class="step">
    <div class="step-head">
      <div class="step-num">2</div>
      <h2>エントリーシート本文</h2>
    </div>

    <div class="es-block es-blue">
      <div class="es-block-title">ガクチカ</div>
      <label for="academic">学業(ゼミ・卒論・資格等)</label>
      <textarea id="academic" placeholder="学業に関するES本文を貼り付け"></textarea>

      <label for="nonacademic">学業以外(サークル・アルバイト・部活動等)</label>
      <textarea id="nonacademic" placeholder="学業以外に関するES本文を貼り付け"></textarea>
    </div>

    <div class="es-block es-green">
      <div class="es-block-title">自己PR</div>
      <label for="selfpr">自己PR</label>
      <textarea id="selfpr" placeholder="自己PRのES本文を貼り付け"></textarea>
    </div>

    <div class="es-block es-purple">
      <div class="es-block-title">志望動機</div>
      <label for="motivation">志望動機</label>
      <textarea id="motivation" placeholder="志望動機のES本文を貼り付け"></textarea>
    </div>

    <div class="es-block es-beige">
      <div class="es-block-title">その他</div>
      <label for="other">その他(あれば)</label>
      <textarea id="other" placeholder="その他、補足したいエピソード等(なければ空欄可)"></textarea>
    </div>
  </div>

  <div class="actions">
    <button id="generateBtn">プロンプトを生成</button>
    <button id="resetBtn">リセット</button>
  </div>

  <div class="step" id="output-section">
    <div class="step-head">
      <div class="step-num">3</div>
      <h2>生成されたプロンプト</h2>
    </div>
    <div id="outputBox"></div>
    <button id="copyBtn">コピーする</button>
    <p class="hint" id="outputHint">コピー後、想定問答作成プロジェクトの新規チャットに貼り付けてください。</p>
  </div>

</main>

<script>
  const generateBtn = document.getElementById('generateBtn');
  const resetBtn = document.getElementById('resetBtn');
  const copyBtn = document.getElementById('copyBtn');
  const outputSection = document.getElementById('output-section');
  const outputBox = document.getElementById('outputBox');
  const modeHint = document.getElementById('modeHint');
  const outputHint = document.getElementById('outputHint');

  const FULL_INSTRUCTIONS = `あなたは大学キャリアカウンセラー「キャリ爺」の想定問答作成アシスタントです。
以下の手順に厳密に従い、学生の面接想定問答を作成してください。

【入力される情報】
・志望企業名
・希望職種
・学生のエントリーシート(学業/学業以外/自己PR/志望動機/その他)
・面接段階(一次面接/二次面接/最終面接のいずれか)

【Step1:企業研究】
以下の情報源を横断的に調査し、「求められる人物像」を言語化してください。
1. 企業公式サイト(採用ページ、代表メッセージ、中期経営計画、事業内容)
2. 就職・転職口コミサイト(OpenWork、転職会議等)の社員・元社員の声
3. 企業の公式SNS(X、Instagram、採用担当者の発信等)
4. 直近のニュースリリース・決算資料(業績動向、新規事業、課題)
まとめる際は、公式の「求める人物像」の引用、口コミから見える実際の社風とのギャップ、
直近の事業動向から見える職種への期待、面接官が確認したがるであろう点を3〜5点整理してください。
口コミサイトの情報は断定せず「〜という声がある」という距離感で扱い、
悪評のみを鵜呑みにして企業批判のトーンにならないよう注意してください。
ウェブ検索を積極的に使用してください。

【Step2:想定問答15問の設計】
以下の構成で15問を作成してください。
1問目:自己紹介(ES全体の要約、1分程度で話せる長さ)
2〜4問目:学業(ゼミ・卒論・資格等)についての深掘り
5〜7問目:学業以外(サークル・アルバイト・部活動等)についての深掘り
8〜9問目:自己PRについての深掘り
10〜13問目:志望動機・企業理解についての深掘り(Step1の企業研究結果を踏まえる)
14問目:その他・逆境や失敗経験など(ESに記載がなければ学業/学業以外から再構成)
15問目:逆質問(「最後に何か質問はありますか」への回答例)

面接段階によって重点を変えてください。
・一次面接:人物像の基礎確認中心。質問は基本的・事実確認型。逆質問は制度・働き方など答えやすい範囲。
・二次面接:深掘り中心。ES内の意思決定の分岐点(なぜAでなくBを選んだか)を突く質問を増やす。
  志望動機は他社との比較まで踏み込む。逆質問は業務内容・配属に関するもの。
・最終面接:入社意欲・覚悟の確認中心。入社後の活躍、他社選考状況、条件面等、経営層目線の質問を含める。
  逆質問は経営方針・将来のキャリアパスに関するもの。

【Step3:回答案作成時の絶対ルール(金太郎飴回避)】
各質問の回答案を作成する際、以下を厳守してください。

絶対に残す要素:
・ES本文に書かれている具体的な数字、固有名詞、エピソードの描写
・ES本文中の「〜も検討したが、あえて〜を選んだ」という意思決定の分岐点
・その学生固有の言い回し(可能な限り、ES原文の表現を活かす)

禁止事項:
・「貴社の理念に共感し」等、どの企業にも使える定型句に言い換えること
・ESに書かれていない実績やエピソードを新たに作り出すこと(捏造禁止)
・複数の学生に共通するような、当たり障りのない一般論での回答

回答の長さ:口頭で1問あたり30秒〜1分程度で話せる分量(200〜300字目安)

【Step4:出力形式】
Word文書として出力してください。構成は以下の通りです。
・表紙:学生名、志望企業名、希望職種、面接段階、作成日
・本文:15問を「質問→回答案→(補足:深掘りされた場合の追加想定)」の3段構成で1問ずつ記載
・末尾:Step1の企業研究サマリーを添付資料として掲載
企業ごとにカラーコードを設定し(既存の「就活の木」運用に準拠)、
面接段階(一次/二次/最終)がひと目でわかるよう見出しに明記してください。

Word文書として出力できない場合は、上記の構成に沿ったテキストで回答してください。

---

以下、対象学生の入力情報です。

`;

  function buildInputBlock() {
    const company = document.getElementById('company').value.trim() || '(未入力)';
    const jobtype = document.getElementById('jobtype').value.trim() || '(未入力)';
    const stage = document.querySelector('input[name="stage"]:checked').value;
    const academic = document.getElementById('academic').value.trim() || '(記載なし)';
    const nonacademic = document.getElementById('nonacademic').value.trim() || '(記載なし)';
    const selfpr = document.getElementById('selfpr').value.trim() || '(記載なし)';
    const motivation = document.getElementById('motivation').value.trim() || '(記載なし)';
    const other = document.getElementById('other').value.trim() || '(記載なし)';

    return `■志望企業名:${company}
■希望職種:${jobtype}
■面接段階:${stage}
■学生のエントリーシート:

【学業】
${academic}

【学業以外】
${nonacademic}

【自己PR】
${selfpr}

【志望動機】
${motivation}

【その他】
${other}`;
  }

  function buildPrompt() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const inputBlock = buildInputBlock();
    if (mode === 'general') {
      return FULL_INSTRUCTIONS + inputBlock;
    }
    return inputBlock;
  }

  function updateModeHint() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    if (mode === 'general') {
      modeHint.textContent = 'ChatGPTなど、想定問答用のカスタム指示を登録していない汎用AIで使う場合はこちら。企業研究〜出力形式までの指示文をまるごと入力内容に同梱します。';
      outputHint.textContent = 'この投稿文には指示文一式が含まれています。汎用AIの新規チャットにそのまま貼り付けてください。';
    } else {
      modeHint.textContent = '「想定問答作成(汎用版)」プロジェクトの指示欄に、あらかじめカスタム指示文を登録済みの場合はこちら。入力内容だけの短い投稿文を作ります。';
      outputHint.textContent = 'コピー後、想定問答作成プロジェクトの新規チャットに貼り付けてください。';
    }
  }

  document.querySelectorAll('input[name="mode"]').forEach(el => {
    el.addEventListener('change', updateModeHint);
  });

  generateBtn.addEventListener('click', () => {
    outputBox.textContent = buildPrompt();
    outputSection.classList.add('show');
    outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    copyBtn.textContent = 'コピーする';
    copyBtn.classList.remove('copied');
  });

  resetBtn.addEventListener('click', () => {
    document.querySelectorAll('input[type="text"], textarea').forEach(el => el.value = '');
    document.querySelector('input[name="stage"][value="一次面接"]').checked = true;
    document.querySelector('input[name="mode"][value="project"]').checked = true;
    updateModeHint();
    outputSection.classList.remove('show');
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(outputBox.textContent);
      copyBtn.textContent = 'コピーしました';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'コピーする';
        copyBtn.classList.remove('copied');
      }, 2000);
    } catch (e) {
      alert('コピーに失敗しました。テキストを選択して手動でコピーしてください。');
    }
  });
</script>

</body>
</html>
