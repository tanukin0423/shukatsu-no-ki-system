<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>就活の木｜筆記対策 動画ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8f5; --ink:#24302a; --sub:#5b6760; --line:#dfe6e0;
  --trunk:#8a6a4a; --accent:#3f7d5a; --focus:#1f6fd1;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171c19; --ink:#e7ece8; --sub:#a9b5ad; --line:#333c36;
    --trunk:#a88563; --accent:#7fbf98; --focus:#7ab0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171c19; --ink:#e7ece8; --sub:#a9b5ad; --line:#333c36;
  --trunk:#a88563; --accent:#7fbf98; --focus:#7ab0ff; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}
h1,h2,h3,.maru{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* hero */
.hero{padding:28px 0 8px;display:grid;grid-template-columns:1fr 280px;gap:12px;align-items:center}
.brand{font-size:14px;color:var(--accent);font-weight:700;margin:0}
.hero h1{font-size:clamp(26px,5vw,36px);line-height:1.35;margin:6px 0 12px;font-weight:700}
.lead{color:var(--sub);margin:0;max-width:34em}
.tree{width:100%;height:auto;display:block}
.tree .leaf{cursor:pointer;transition:fill-opacity .4s}
.tree .leaf:focus-visible{outline:none;stroke:var(--focus);stroke-width:3}
.count{text-align:center;font-size:14px;color:var(--sub);margin:-4px 0 0}
.count b{font-size:20px;color:var(--ink)}

/* nav */
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav{top:env(safe-area-inset-top,0px)}
.groups{display:flex;gap:18px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.grp{flex:0 0 auto}
.grp-name{font-size:12px;color:var(--sub);margin:0 0 4px}
.chips{display:flex;gap:6px}
.chip{border:1.5px solid var(--g);color:var(--ink);background:transparent;border-radius:999px;
  padding:5px 12px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--g)}
.chip[aria-current="true"]{background:var(--g);color:#fff}
.chip[aria-current="true"] .dot{background:#fff}

/* genre */
main{padding:24px 0 40px}
.ghead{border-left:8px solid var(--g);padding:2px 0 2px 16px;margin-bottom:18px}
.ghead .grpl{font-size:13px;color:var(--sub);margin:0}
.ghead h2{font-size:28px;margin:2px 0 6px;line-height:1.3}
.ghead p{margin:0;color:var(--sub);max-width:36em}
.tips{background:color-mix(in srgb,var(--g) 9%,var(--bg));border-radius:10px;padding:14px 18px;margin:0 0 22px}
.tips h3{font-size:15px;margin:0 0 4px;color:var(--ink)}
.tips ul{margin:0;padding-left:1.2em}
.tips li{margin:2px 0}
.prog{font-size:14px;color:var(--sub);margin:0 0 10px}
ol.videos{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.v{display:grid;grid-template-columns:52px 1fr;gap:4px 14px;padding:16px 0;border-bottom:1px solid var(--line)}
.num{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:26px;color:var(--gtext);line-height:1.2;text-align:center}
.v.done .num{opacity:.45}
.vt{font-weight:700;font-size:17px;margin:0}
.theme{display:inline-block;background:var(--g);color:#fff;font-size:13px;border-radius:6px;padding:1px 8px;margin:4px 6px 4px 0}
.note{display:inline-block;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 7px}
.vd{margin:2px 0 8px;color:var(--sub);font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:14px;border-radius:8px;padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.watch{background:var(--g);color:#fff;border:1.5px solid var(--g)}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.seen{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;padding:6px 4px}
.seen input{width:20px;height:20px;accent-color:var(--g)}
.qrbox{grid-column:2;margin-top:8px;display:flex;gap:14px;align-items:center}
.qrbox svg{width:132px;height:132px;background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line)}
.qrbox p{margin:0;font-size:13px;color:var(--sub);max-width:20em}

/* home */
.home h2{font-size:22px;margin:0 0 8px}
.home p{color:var(--sub);margin:0 0 14px;max-width:36em}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:8px 0 28px;padding:0;list-style:none}
.gl a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;
  border-left:6px solid var(--g);background:color-mix(in srgb,var(--g) 7%,var(--bg));border-radius:0 8px 8px 0;padding:10px 14px}
.gl .n{font-weight:700}
.gl .c{font-size:13px;color:var(--sub);white-space:nowrap}
.howto{border-top:1px solid var(--line);padding-top:18px}
.howto ul{padding-left:1.2em;margin:0;color:var(--sub)}
footer{border-top:1px solid var(--line);padding:20px 0 28px;font-size:13px;color:var(--sub)}
footer p{margin:4px 0}
.reset{background:none;border:none;color:var(--sub);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:0}

@media (min-width:641px){ .groups{flex-wrap:wrap;overflow:visible;gap:10px 22px} .grp{flex:0 1 auto;min-width:0;max-width:100%} .chips{flex-wrap:wrap} }
@media (max-width:640px){
  .hero{grid-template-columns:1fr;padding-top:20px}
  .hero .treebox{max-width:210px;margin:0 auto}
  .v{grid-template-columns:40px 1fr}
  .num{font-size:22px}
  .qrbox{grid-column:1 / -1}
}
.pbtn{margin-top:12px}
.booktool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.booktool p{margin:0;font-size:14px;color:var(--sub);flex-basis:100%}
.bp{--sub:#555;--ink:#222;--line:#ddd;--trunk:#8a6a4a;background:#fff;color:#222;width:min(100%,794px);aspect-ratio:210/297;margin:0 auto 24px;padding:6% 7%;position:relative;
  box-shadow:0 1px 3px rgba(0,0,0,.18),0 8px 24px rgba(0,0,0,.08);overflow:hidden;font-size:15px}
.bp .ptitle{display:block;font-size:12px;color:#555;margin:0 0 14px;border-bottom:1px solid #ccc;padding-bottom:6px}
.bp .pno{position:absolute;bottom:3.5%;left:0;right:0;text-align:center;font-size:12px;color:#666}
.bp .pqr{display:flex;grid-column:3;grid-row:1;align-items:center;justify-content:center}
.bp .pqr svg{width:84px;height:84px}
.bp .v{grid-template-columns:44px 1fr 96px;padding:8px 0;border-bottom:1px solid #ddd}
.bp ol.videos{border-top:1.5px solid #bbb}
.bp .num{color:var(--g)}
.bp .ghead p,.bp .vd{color:#444}
.bp .tips{background:#f5f5f5}
.bp .ghead h2{font-size:26px}
.cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.cover .cb{color:#3f7d5a;font-weight:700;font-size:16px;margin:0}
.cover h1{font-size:34px;line-height:1.4;margin:10px 0 6px}
.cover .cs{font-size:17px;color:#444;margin:0 0 26px}
.cover svg{width:62%;height:auto}
.cover .cm{margin-top:22px;font-size:14px;color:#555;line-height:1.9}
.toc h2{font-size:24px;margin:0 0 12px}
.toc .tg{font-size:13px;color:#555;margin:14px 0 4px}
.toc ul{list-style:none;margin:0;padding:0}
.toc li{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dotted #bbb}
.toc li .sw{width:10px;height:10px;border-radius:2px;background:var(--g);flex:0 0 auto;align-self:center}
.toc li .tn{font-weight:700}
.toc li .tc{font-size:13px;color:#666}
.toc li .tp{margin-left:auto;font-weight:700}
.endp h2{font-size:22px;margin:0 0 10px}
.endp p,.endp li{color:#333}
.endp .chq{display:flex;gap:16px;align-items:center;margin:18px 0}
.endp .chq svg{width:110px;height:110px}
.pqr{display:none}
.ponly{display:none}
.ptitle{display:none}
@media print{
  @page{size:A4;margin:16mm 18mm 14mm}
  :root{padding:0}
  html,body{width:auto}
  body{background:#fff;color:#222;font-size:12pt;line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before,.hero,nav,.acts,.qrbox,.pbtn,.reset{display:none!important}
  .wrap{max-width:none;padding:0 4mm}
  main{padding:0}
  .ptitle{display:block;max-width:none!important;font-size:10pt;color:#555;margin:0 0 5mm;border-bottom:1px solid #ccc;padding-bottom:2mm}
  .ghead{margin-bottom:4mm;padding-left:5mm}
  .ghead .grpl{font-size:10pt}
  .ghead h2{font-size:24pt;margin:1mm 0 2mm}
  .ghead p{font-size:11.5pt;color:#333}
  .tips{padding:3mm 5mm;margin-bottom:4mm;background:#f5f5f5!important}
  .tips h3{font-size:12pt}
  .tips li{font-size:11pt}
  ol.videos{border-top:1.5px solid #bbb}
  .v{grid-template-columns:15mm 1fr 28mm;gap:0.5mm 5mm;padding:2mm 0;border-bottom:1px solid #ccc;break-inside:avoid}
  .num{font-size:20pt}
  .vt{font-size:14pt}
  .theme{font-size:10.5pt;padding:0.3mm 2.5mm}
  .note{font-size:9.5pt}
  .vd{font-size:11.5pt;margin:1mm 0 0;color:#333}
  .pqr{display:flex;grid-column:3;grid-row:1;align-items:center;justify-content:center}
  .pqr svg{width:24mm;height:24mm}
  .noprint{display:none!important}
  .ponly{display:list-item}
  .v.done .num{opacity:1}
  .home h2{font-size:18pt}
  .home p{font-size:11.5pt;color:#333}
  .gl{grid-template-columns:repeat(3,1fr);gap:2.5mm;margin:1mm 0 4mm}
  .home p[style]{margin:3mm 0 1mm!important}
  .gl a{background:#f5f5f5!important;padding:2mm 4mm}
  .howto{padding-top:3mm}
  .howto h2{font-size:15pt;margin:0 0 1mm}
  .gl .n{font-size:12pt}
  .howto ul{color:#333;font-size:11.5pt}
  .booktool{display:none!important}
  .bp{width:auto;aspect-ratio:auto;height:266mm;margin:0;padding:0 4mm 11mm;box-shadow:none;break-after:page;font-size:12pt}
  .bookmode footer{display:none!important}
  .bp:last-child{break-after:auto}
  .bp .pno{bottom:0;font-size:9.5pt}
  .bp .v{grid-template-columns:15mm 1fr 26mm;padding:1.2mm 0}
  .bp .vd{font-size:11pt}
  .bp .tips{padding:2.5mm 5mm;margin-bottom:3mm}
  .bp .ghead{margin-bottom:3mm}
  .bp .pqr svg{width:22mm;height:22mm}
  .cover h1{font-size:28pt}
  .pg{break-after:page}
  .pg:last-child{break-after:auto}
  footer{border-top:1px solid #ccc;padding-top:3mm;font-size:9.5pt;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){.tree .leaf{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <p class="brand">🌱 就活の木｜筆記対策</p>
      <h1>動画で学ぶという選択肢</h1>
      <p class="lead">筆記対策の勉強方法は、問題集、学内の講座、アプリなど、いろいろあります。その選択肢の一つとして、YouTubeの「桐生SPIチャンネル」を分野別にまとめました。基礎から丁寧に解説している無料のチャンネルです。自分に合うと思えば使えばいいし、合わなければ別の方法で大丈夫です。</p>
    </div>
    <div class="treebox">
      <svg class="tree" id="tree" viewBox="0 0 300 262" role="group" aria-label="分野ごとの進み具合。葉をえらぶとその分野が開きます"></svg>
      <p class="count">見た動画 <b id="cnt">0</b> / <span id="tot">0</span>本</p>
    </div>
  </header>
</div>
<nav aria-label="分野">
  <div class="wrap"><div class="groups" id="groups"></div></div>
</nav>
<div class="wrap">
  <main id="main"></main>
  <footer>
    <p>動画：桐生SPIチャンネル（YouTube・無料）／ページ作成：就活の木</p>
    <p>このページは就活の木が学生向けに個人的にまとめた案内で、桐生SPIチャンネルの公式ページではありません。</p>
    <p class="noprint">「見た」の記録は、この端末のブラウザにだけ保存されます。 <button class="reset" id="reset">記録をすべて消す</button></p>
  </footer>
</div>

  document.getElementById("tot").textContent = allIds.length;
}

/* nav */
function drawNav(cur){
  const groups = [...new Set(G.map(g => g.group))];
  document.getElementById("groups").innerHTML = groups.map(gr => `
    <div class="grp"><p class="grp-name">${esc(gr)}</p><div class="chips">${
      G.filter(g => g.group === gr).map(g => `<button class="chip" style="--g:${g.color}" data-id="${g.id}" aria-current="${g.id===cur}"><span class="dot"></span>${esc(g.name)}</button>`).join("")
    }</div></div>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => go(b.dataset.id)));
  const c = document.querySelector('.chip[aria-current="true"]');
  if (c) c.scrollIntoView({block:"nearest", inline:"center"});
}

function go(id){ if (location.hash !== "#" + id) location.hash = id; else render(); }

/* views */
function home(){
  const groups = [...new Set(G.map(g => g.group))];
  return `<section class="home pg">
    <p class="ptitle">🌱 就活の木｜筆記対策 動画ガイド　──　動画で学ぶという選択肢（桐生SPIチャンネル・無料）</p>
    <h2>分野をえらぶ</h2>
    <p>迷ったら、ほかの分野の土台になる「割合」や「損益算」から。<span class="noprint">上の木の葉も、見た動画が増えるほど色が濃くなります。</span></p>
    ${groups.map(gr => `<p style="margin:14px 0 4px;font-size:14px">${esc(gr)}</p><ul class="gl">${
      G.filter(g => g.group === gr).map(g => `<li><a href="#${g.id}" style="--g:${g.color}"><span class="n">${esc(g.name)}</span><span class="c">${g.videos.filter(v=>seen[v.id]).length} / ${g.videos.length}本</span></a></li>`).join("")
    }</ul>`).join("")}
    <div class="howto"><h2>使ってみるなら、たとえばこんな方法も</h2><ul>
      <li>1日1本くらいのペースで。通学の電車の中でも見られます。</li>
      <li>見終わったら、問題集で同じタイプの問題を1問だけ解いてみる。</li>
      <li>見た動画には印を。続いた日数を数えると、三日坊主を越えやすくなります。</li>
      <li class="noprint">パソコンで見ているときは「QRコード」を開くと、スマホで続きを見られます。</li>
      <li class="ponly">各分野のページのQRコードをスマホで読み取ると、動画が開きます。</li>
    </ul>
    <p class="acts" style="margin-top:14px"><button class="btn ghost pbtn" onclick="window.print()">この目次を印刷する</button>
    <a class="btn ghost pbtn" href="#print-all">全17ページを印刷用に表示</a>
    <a class="btn ghost pbtn" href="#book">ブック印刷モード（表紙・目次・ページ番号つき）</a></p></div></section>`;
}
function genre(g, forPrint){
  const done = g.videos.filter(v => seen[v.id]).length;
  return `<section class="pg" style="--g:${g.color};--gtext:${gtext(g.color)}">
    <p class="ptitle">🌱 就活の木｜筆記対策 動画ガイド　──　動画で学ぶという選択肢（桐生SPIチャンネル・無料）</p>
    <div class="ghead"><p class="grpl">${esc(g.group)}</p><h2>${esc(g.name)}</h2><p>${esc(g.intro)}</p>${forPrint ? "" : `<button class="btn ghost pbtn" onclick="window.print()">この分野を印刷する</button>`}</div>
    ${g.tips.length ? `<div class="tips"><h3>${g.id==="gengo" ? "補足と、伸ばし方の例" : "見る順番のめやす"}</h3><ul>${g.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    ${forPrint ? "" : `<p class="prog">${g.videos.length}本中 ${done}本 見ました</p>`}
    <ol class="videos">${g.videos.map((v,i) => `
      <li class="v ${seen[v.id]?"done":""}">
        <div class="num" aria-hidden="true">${String(i+1).padStart(2,"0")}</div>
        <div>
          <p class="vt">${esc(v.title)}</p>
          <span class="theme">${esc(v.theme)}</span>${v.note ? `<span class="note">${esc(v.note)}</span>` : ""}
          <p class="vd">${esc(v.desc)}</p>
          <div class="acts">
            <a class="btn watch" href="${YT}${v.id}" target="_blank" rel="noopener">YouTubeで見る</a>
            <button class="btn ghost qrt" data-id="${v.id}" aria-expanded="false">QRコード</button>
            <label class="seen"><input type="checkbox" data-id="${v.id}" ${seen[v.id]?"checked":""}>見た</label>
          </div>
        </div>
        <div class="pqr">${qrSvg(v.id)}</div>
        <div class="qrbox" hidden></div>
      </li>`).join("")}
    </ol></section>`;
}
const PT = `<p class="ptitle">🌱 就活の木｜筆記対策 動画ガイド　──　動画で学ぶという選択肢（桐生SPIチャンネル・無料）</p>`;
function bookPages(){
  const pages = [];
  G.forEach(g => {
    let s = 0;
    while (s < g.videos.length) {
      const per = s === 0 ? (g.videos.length > 6 ? 6 : g.videos.length) : 8;
      pages.push({g, start:s, vids:g.videos.slice(s, s + per), cont:s > 0}); s += per;
    }
  });
  return pages;
}
function vRow(v, i){
  return `<li class="v"><div class="num" aria-hidden="true">${String(i+1).padStart(2,"0")}</div><div>
    <p class="vt">${esc(v.title)}</p><span class="theme">${esc(v.theme)}</span>${v.note ? `<span class="note">${esc(v.note)}</span>` : ""}
    <p class="vd">${esc(v.desc)}</p></div><div class="pqr">${qrSvg(v.id)}</div></li>`;
}
function book(){
  const pages = bookPages();
  const first = {}; pages.forEach((p,i) => { if (!(p.g.id in first)) first[p.g.id] = i + 2; });
  const groups = [...new Set(G.map(g => g.group))];
  const treeSvg = document.getElementById("tree").outerHTML.replace(/fill-opacity="[0-9.]+"/g, 'fill-opacity="0.85"').replace(/class="tree"/, "").replace(/ id="tree"/, "");
  let h = `<div class="booktool"><button class="btn watch" style="--g:#3f7d5a" onclick="window.print()">ブックを印刷する</button><a class="btn ghost" href="#">もどる</a>
    <p>表紙・目次・${G.length}分野・あとがきの順に、A4で${pages.length + 3}ページになります。印刷画面で「両面印刷」を選ぶと冊子のように使えます。プリンターに「小冊子印刷」の機能があれば、中とじの冊子にもできます。</p></div>`;
  h += `<section class="bp cover"><p class="cb">🌱 就活の木｜筆記対策</p><h1>動画で学ぶという選択肢</h1>
    <p class="cs">桐生SPIチャンネル　分野別ガイドブック</p>${treeSvg}
    <p class="cm">${G.length}分野・${allIds.length}本の動画を、QRコードつきでまとめました。<br>気になる分野から、1日1本くらいのペースでどうぞ。</p></section>`;
  h += `<section class="bp toc">${PT}<h2>目次</h2>${groups.map(gr => `<p class="tg">${esc(gr)}</p><ul>${
      G.filter(g => g.group === gr).map(g => `<li style="--g:${g.color}"><span class="sw"></span><span class="tn">${esc(g.name)}</span><span class="tc">${g.videos.length}本</span><span class="tp">${first[g.id]}</span></li>`).join("")}</ul>`).join("")}
    <p class="pno">1</p></section>`;
  pages.forEach((p, i) => {
    const g = p.g;
    h += `<section class="bp" style="--g:${g.color}">${PT}
      <div class="ghead"><p class="grpl">${esc(g.group)}</p><h2>${esc(g.name)}${p.cont ? "（つづき）" : ""}</h2>${p.cont ? "" : `<p>${esc(g.intro)}</p>`}</div>
      ${!p.cont && g.tips.length ? `<div class="tips"><h3>${g.id==="gengo" ? "補足と、伸ばし方の例" : "見る順番のめやす"}</h3><ul>${g.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
      <ol class="videos">${p.vids.map((v,k) => vRow(v, p.start + k)).join("")}</ol><p class="pno">${i + 2}</p></section>`;
  });
  h += `<section class="bp endp">${PT}<h2>このガイドの使い方</h2><ul>
      <li>QRコードをスマホのカメラで読み取ると、その動画が開きます。</li>
      <li>1日1本くらいのペースで。見終わったら、問題集で同じタイプの問題を1問だけ解いてみましょう。</li>
      <li>分からなかった回は、もう一度見る。くり返すほど身につきます。</li>
      <li>迷ったら、ほかの分野の土台になる「割合」や「損益算」から。</li></ul>
    <div class="chq">${qrSvg("_ch")}<p>桐生SPIチャンネル（トップページ）<br>ここから、ほかの動画も探せます。</p></div>
    <p>動画：桐生SPIチャンネル（YouTube・無料）／ガイド作成：就活の木</p>
    <p>このガイドは就活の木が学生向けに個人的にまとめた案内で、桐生SPIチャンネルの公式資料ではありません。筆記対策の勉強方法は、問題集、学内の講座、アプリなどいろいろあります。その選択肢の一つとして使ってください。</p>
    <p class="pno">${pages.length + 2}</p></section>`;
  return h;
}
function render(){
  const id = location.hash.slice(1);
  const g = G.find(x => x.id === id);
  document.body.classList.toggle("bookmode", id === "book");
  if (id === "book") {
    drawTree(); document.getElementById("main").innerHTML = book(); drawNav(null); return;
  }
  if (id === "print-all") {
    document.getElementById("main").innerHTML = `<p class="acts pbtn" style="margin:0 0 16px"><button class="btn watch" style="--g:#3f7d5a" onclick="window.print()">全17ページを印刷する</button><a class="btn ghost" href="#">もどる</a></p>` + home() + G.map(x => genre(x, true)).join("");
    drawNav(null); drawTree(); return;
  }
  document.getElementById("main").innerHTML = g ? genre(g) : home();
  drawNav(g ? g.id : null);
  drawTree();
  document.querySelectorAll(".qrt").forEach(b => b.addEventListener("click", () => {
    const box = b.closest(".v").querySelector(".qrbox");
    const open = box.hidden;
    if (open) box.innerHTML = qrSvg(b.dataset.id) + `<p>スマホのカメラで読み取ると、この動画が開きます。</p>`;
    box.hidden = !open; b.setAttribute("aria-expanded", open);
    b.textContent = open ? "QRコードを閉じる" : "QRコード";
  }));
  document.querySelectorAll('.seen input').forEach(c => c.addEventListener("change", () => {
    if (c.checked) seen[c.dataset.id] = Date.now(); else delete seen[c.dataset.id];
    save();
    document.querySelectorAll(`.seen input[data-id="${c.dataset.id}"]`).forEach(x => { x.checked = c.checked; x.closest(".v").classList.toggle("done", c.checked); });
    const gg = G.find(x => x.id === location.hash.slice(1));
    if (gg) document.querySelector(".prog").textContent = `${gg.videos.length}本中 ${gg.videos.filter(v=>seen[v.id]).length}本 見ました`;
    drawTree();
  }));
}
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("この端末の「見た」の記録をすべて消します。よろしいですか？")) { seen = {}; save(); render(); }
});
addEventListener("hashchange", () => { render(); document.getElementById("main").scrollIntoView({block:"start"}); });
render();
</script>
</body>
</html>
